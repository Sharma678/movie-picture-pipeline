backend-ci:
  runs-on: ubuntu-latest

  defaults:
    run:
      working-directory: starter/backend

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Pipenv
      run: pip install pipenv

    - name: Install dependencies
      run: pipenv install

    - name: Run lint
      run: pipenv run lint

    - name: Run tests
      run: pipenv run test